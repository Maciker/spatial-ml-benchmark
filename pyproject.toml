[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spatial-ml-benchmark"
version = "0.1.0"
description = "Reproducible spatial machine-learning benchmarking."
requires-python = ">=3.12"
dependencies = [
  "geopandas>=1.0,<2.0",
  "numpy>=2.0,<3.0",
  "pandas>=2.0,<3.0",
  "scikit-learn>=1.6,<2.0",
  "shapely>=2.0,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "ruff>=0.8,<1.0"]

[tool.ruff]
line-length = 100
